<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Thumbnail Maker - Tạo Thumbnail YouTube/TikTok</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎨</span>
                <h1>AI Thumbnail Maker</h1>
            </div>
            <p class="subtitle">Tạo thumbnail YouTube/TikTok hút mắt chỉ trong vài giây với AI</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <div class="input-container">
                <input
                    type="text"
                    id="videoUrl"
                    placeholder="Nhập URL video YouTube (vd: https://youtube.com/watch?v=...)"
                    class="url-input"
                >
                <button onclick="analyzeVideo()" id="analyzeBtn" class="analyze-btn">
                    <span id="btnText">Phân Tích Video</span>
                    <span id="btnLoader" class="loader hidden"></span>
                </button>
            </div>
            <p class="hint">💡 App sẽ phân tích video và đề xuất 4 ý tưởng thumbnail tối ưu CTR</p>
        </section>

        <!-- Loading State -->
        <div id="loadingState" class="loading-state hidden">
            <div class="spinner"></div>
            <p>Đang phân tích video với Google Gemini AI...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-state hidden">
            <span class="error-icon">⚠️</span>
            <p id="errorMessage"></p>
        </div>

        <!-- Results Section -->
        <section id="resultsSection" class="results-section hidden">
            <!-- Video Info -->
            <div class="video-info">
                <h2 id="videoTitle"></h2>
                <p id="videoDescription" class="video-description"></p>
            </div>

            <!-- Best Recommendation -->
            <div class="best-recommendation">
                <div class="badge">⭐ ĐỀ XUẤT TỐT NHẤT</div>
                <h3>Ý Tưởng Có CTR Cao Nhất</h3>
                <p id="recommendationReason" class="recommendation-text"></p>
            </div>

            <!-- Thumbnail Ideas -->
            <div class="ideas-grid" id="ideasGrid">
                <!-- Ideas will be inserted here dynamically -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by <strong>Google Gemini AI</strong> 🚀</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
